name: General Soul Samsara

on:
  pull_request:
    paths:
      - "general-soul-samsara/**"
      - ".github/workflows/general-soul-samsara.yml"
  push:
    branches: [main]
    paths:
      - "general-soul-samsara/**"
      - ".github/workflows/general-soul-samsara.yml"

jobs:
  test:
    name: Lint / Unit / E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm -F @noname/general-soul-samsara lint

      - name: Unit tests
        run: pnpm -F @noname/general-soul-samsara test

      - name: Build mode
        run: pnpm -F @noname/general-soul-samsara build

      - name: Install Playwright browsers
        run: pnpm --filter @noname/general-soul-samsara exec playwright install --with-deps chromium

      - name: E2E smoke tests
        run: pnpm -F @noname/general-soul-samsara test:e2e
